name: IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy and notify IndexNow
        env:
          INDEXNOW_KEY: 8a166efa4e6e33f2018da93bd27c1973
          SITE_ORIGIN: https://featherstonevaults.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const key = process.env.INDEXNOW_KEY
          const origin = process.env.SITE_ORIGIN
          const expectedCommit = process.env.EXPECTED_COMMIT
          const keyUrl = `${origin}/${key}.txt`
          const markerUrl = `${origin}/build.txt`
          const sitemapUrl = `${origin}/sitemap.xml`

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          async function waitForDeploy() {
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              try {
                const markerResponse = await fetch(markerUrl, { cache: 'no-store' })
                if (markerResponse.ok) {
                  const deployedCommit = (await markerResponse.text()).trim()
                  if (deployedCommit === expectedCommit) return
                }
              } catch {}

              console.log(`Production commit not ready yet (${attempt}/24)`)
              await sleep(15000)
            }

            throw new Error('Production did not reach the expected commit')
          }

          async function main() {
            await waitForDeploy()

            const keyResponse = await fetch(keyUrl, { cache: 'no-store' })
            if (!keyResponse.ok || (await keyResponse.text()).trim() !== key) {
              throw new Error('IndexNow key file is not available on production')
            }

            const sitemapResponse = await fetch(sitemapUrl, { cache: 'no-store' })
            if (!sitemapResponse.ok) {
              throw new Error(`Could not fetch sitemap: ${sitemapResponse.status}`)
            }

            const sitemap = await sitemapResponse.text()
            const urlList = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1])
            if (urlList.length === 0) throw new Error('Sitemap contained no URLs')

            const response = await fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                host: 'featherstonevaults.com',
                key,
                keyLocation: keyUrl,
                urlList,
              }),
            })

            if (!response.ok) {
              throw new Error(`IndexNow returned ${response.status}: ${await response.text()}`)
            }

            console.log(`Verified production commit ${expectedCommit}`)
            console.log(`Submitted ${urlList.length} sitemap URLs to IndexNow`)
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
