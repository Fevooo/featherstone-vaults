name: Check enquiry forms

# A manual end-to-end check that the live enquiry endpoint is actually
# delivering. Run it from the Actions tab after changing anything about the
# forms, the Resend key or the Netlify form settings.
#
# The endpoint returns 200 if either delivery channel accepted the enquiry, so
# a single probe cannot say which one did. This sends two:
#
#   A. A real form name, so both channels are tried.
#   B. An unrecognised form name. The handler skips the Netlify channel for
#      those, so this isolates Resend.
#
# Comparing them identifies the failing channel exactly. Both arrive in the
# house inbox when everything works, marked as self-tests, so this is manual
# dispatch only and should not be put on a schedule.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live endpoint
        env:
          SITE_ORIGIN: https://featherstonevaults.com
        run: |
          node <<'NODE'
          const origin = process.env.SITE_ORIGIN

          async function probe(label, formName) {
            const body = new URLSearchParams({
              form: formName,
              name: 'Automated site check',
              email: 'site-selftest@featherstonevaults.com',
              message:
                `Automated check (${label}) of the enquiry endpoint, sent from GitHub Actions. ` +
                'No reply is needed.',
            })
            const response = await fetch(`${origin}/api/enquiry`, {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body,
            })
            console.log(`  ${label.padEnd(22)} ${response.status}  ${(await response.text()).trim()}`)
            return response.status
          }

          async function main() {
            const marker = await fetch(`${origin}/build.txt`, { cache: 'no-store' })
            console.log(`live commit            ${marker.ok ? (await marker.text()).trim() : `unavailable (${marker.status})`}`)

            const declarations = await fetch(`${origin}/__forms.html`, { cache: 'no-store' })
            console.log(`/__forms.html          ${declarations.status}`)
            console.log('')

            console.log('probes')
            const both = await probe('both channels', 'general-enquiry')
            const resendOnly = await probe('resend only', '__probe-unregistered')
            console.log('')

            /* Resend is the only channel the second probe can have used. */
            const resendWorks = resendOnly === 200
            const somethingWorks = both === 200
            /* If the pair disagree, the first probe was carried by Netlify. */
            const netlifyWorks = somethingWorks && !resendWorks

            console.log(`Resend email       ${resendWorks ? 'WORKING' : 'NOT WORKING'}`)
            console.log(`Netlify Forms      ${netlifyWorks ? 'WORKING' : resendWorks ? 'UNKNOWN (Resend answered first)' : 'NOT WORKING'}`)
            console.log('')

            if (resendWorks && netlifyWorks) {
              console.log('Both channels are live.')
            } else if (resendWorks) {
              console.log('Email is being delivered. Check Netlify > Forms for a recorded')
              console.log('submission to confirm the backup channel; nothing is broken if it is missing,')
              console.log('but enquiries would then have no durable record.')
            } else if (netlifyWorks) {
              console.log('Enquiries are being recorded but NOT emailed. Resend is refusing the send:')
              console.log('see Netlify > Logs > Functions > enquiry for the reason. Most often the')
              console.log('sender address is not on a domain verified in Resend.')
              process.exitCode = 1
            } else {
              console.log('Nothing is delivering. The endpoint is reachable but both channels failed.')
              console.log(`Status ${both} on the real form name: ${both === 503 ? 'no API key is reaching the function.' : 'the key is set but Resend refused.'}`)
              process.exitCode = 1
            }
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
